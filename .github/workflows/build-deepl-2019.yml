name: Build DeepL 2019

on:
  workflow_dispatch:
  push:
    branches:
      - studio_2019
    paths:
      - 'DeepLMTProvider/**'
      - 'lib/SDL/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Register ResGen.exe in Windows registry
        shell: pwsh
        run: |
          $resgen = Get-ChildItem "C:\Program Files (x86)\Microsoft SDKs" -Recurse -Filter "ResGen.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($resgen) {
            Write-Host "Found ResGen.exe at $($resgen.FullName)"
            $regPath = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\NETFXSDK\4.6.2\WinSDK-NetFx40Tools-x86"
            New-Item -Path $regPath -Force | Out-Null
            Set-ItemProperty -Path $regPath -Name "InstallationFolder" -Value "$($resgen.DirectoryName)\"
          } else {
            Write-Error "ResGen.exe not found"
          }
      - name: Restore NuGet packages
        run: nuget restore DeepLMTProvider/Sdl.Community.DeelLMTProvider/Sdl.Community.DeepLMTProvider.csproj
      - name: Build
        run: msbuild DeepLMTProvider/Sdl.Community.DeelLMTProvider/Sdl.Community.DeepLMTProvider.csproj /p:Configuration=Release
      - name: Find sdlplugin
        run: Get-ChildItem -Path . -Recurse -Filter *.sdlplugin | Select-Object FullName
        shell: pwsh
      - name: List sdlplugin contents and show plugin.xml
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path . -Recurse -Filter *.sdlplugin | Select-Object -First 1
          if ($plugin) {
            Write-Host "=== Contents of $($plugin.Name) ==="
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($plugin.FullName)
            $zip.Entries | ForEach-Object { Write-Host $_.FullName }
            $entry = $zip.Entries | Where-Object { $_.Name -like "*.plugin.xml" } | Select-Object -First 1
            if ($entry) {
              Write-Host "=== $($entry.FullName) ==="
              $reader = New-Object System.IO.StreamReader($entry.Open())
              Write-Host $reader.ReadToEnd()
              $reader.Dispose()
            }
            $zip.Dispose()
          }
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepLMTProvider-2019
          path: '**/*.sdlplugin'
